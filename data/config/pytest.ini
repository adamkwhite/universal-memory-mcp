[pytest]
testpaths = tests
# Import roots for the suite. CI installs with --no-install-project (no .pth),
# so without this the runner has to export PYTHONPATH itself -- which needs a
# platform-specific separator (':' vs ';') and breaks on Windows. pytest joins
# these with os.pathsep for us. Local dev venvs have an editable .pth and so
# never noticed the gap.
pythonpath = . src
addopts = -v --tb=short
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
