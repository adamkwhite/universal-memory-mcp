[project]
name = "universal-memory-mcp"
version = "0.1.0"
description = "A Model Context Protocol server for searchable local storage of AI conversation history — Claude, ChatGPT, Cursor, and custom formats"
readme = "README.md"
requires-python = ">=3.10"
# PEP 639 SPDX form. Requires setuptools>=77; [build-system] pins well above that.
# 77 is a fixed external fact (the release that added PEP 639 support) and is safe to
# name here. The PIN is not — it moves on every dependabot bump, and restating it in
# prose drifted within hours of being written: #223 took the pin to >=84 while this
# comment still said >=83.
# Deliberately NO "License :: OSI Approved :: MIT License" classifier: PEP 639
# supersedes it and PyPI rejects an upload carrying both.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adam White", email = "adamkwhite@gmail.com" }]
keywords = [
    "mcp", "model-context-protocol", "claude", "chatgpt", "cursor",
    "memory", "conversation-history", "full-text-search", "sqlite", "fts5",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    # Linux and Windows are both verified in CI on every PR (build.yml); macOS
    # is expected to work but has no runner, so this claims portability, not
    # coverage.
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "mcp[cli]==1.29.0",
    "jsonschema==4.26.0",
    "aiofiles==25.1.0",
]

# Pinned to exact versions (not floors) as a floor of defense for anyone who
# installs with plain `pip install -e .` outside CI, bypassing the lockfile.
# CI itself installs from `uv.lock` (`uv sync --locked`), which is the actual
# source of truth for the full resolved dependency graph, including
# transitive deps these direct-dep pins can't cover (SonarCloud
# githubactions:S8544 -- "Using dependencies without locking resolved
# versions is security-sensitive"). Bump a version here, then run `uv lock`
# to update uv.lock to match -- CI enforces the two stay in sync.
[project.scripts]
# Lets an MCP config say `"command": "universal-memory-mcp"` instead of naming an
# absolute path into the source tree — which is what broke when #225 moved the
# modules into a package (relative imports cannot be run as a loose script).
universal-memory-mcp = "universal_memory_mcp.server_fastmcp:main"

[project.urls]
Homepage = "https://github.com/adamkwhite/universal-memory-mcp"
Repository = "https://github.com/adamkwhite/universal-memory-mcp"
Issues = "https://github.com/adamkwhite/universal-memory-mcp/issues"
Changelog = "https://github.com/adamkwhite/universal-memory-mcp/releases"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    "psutil==7.2.2",
    "types-aiofiles==25.1.0.20260518",
]
# CI-only lint tooling (quick-checks job in build.yml). Ruff is now the single
# owner of lint/format/import-sorting, matching pre-commit -- CI used to run a
# second, conflicting toolchain (black/isort/flake8) against the same files,
# which is how an isort pass silently relocated a `# type: ignore` comment and
# broke a mypy fix (#156). Pinned for the same S8544 reason as dev.
lint = [
    "ruff==0.16.3",
    "mypy==2.3.0",
    # mypy needs the same stubs the pre-commit hook installs, or the CI type
    # check fails on `Library stubs not installed for "aiofiles"` even though
    # it passes in a dev venv that happens to have them via the dev extra.
    "types-aiofiles==25.1.0.20260518",
]

[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
# Only universal_memory_mcp and its subpackages. Before #225 the modules sat loose in
# src/, so find() skipped them entirely and the wheel shipped without the application.
include = ["universal_memory_mcp*"]

[tool.ruff]
line-length = 100
target-version = "py310"  # matches requires-python floor above; CI runs 3.14

lint.select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (ruff is now the single owner of import sorting; see below)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "BLE", # flake8-blind-except
    "PT011",  # pytest.raises too broad — require match= or a specific exception
    "PT012",  # pytest.raises block must be a single simple statement
    "PLE",    # pylint errors only — bad format args, duplicate keys, real bugs
    "LOG",    # flake8-logging — logging API footguns
    "FLY",    # static str.join that should be an f-string
    "PIE",    # flake8-pie — misc footguns (chained startswith, dead pass)
    "A",      # flake8-builtins — shadowing builtins
    "PGH",    # pygrep-hooks — blanket type:ignore / noqa
    "TRY004", # raise TypeError (not ValueError) for type checks
    "TRY400", # use logging.exception (keeps traceback), not logging.error, in except
    "RUF012", # mutable class attribute defaults (shared-state footgun)
]

lint.ignore = [
    "E501",  # line too long (handled by ruff format)
    "B008",  # function calls in argument defaults
    "B905",  # zip without explicit strict parameter
]

exclude = [
    ".git",
    ".venv",
    "claude-memory-mcp-venv",
    "__pycache__",
    "build",
    "dist",
    "data",
    "scripts",  # operational one-offs, out of quality scope (mirrors sonar.exclusions)
    # Ruff 0.16 began formatting Python code blocks inside Markdown. Docs here
    # include historical design write-ups and completed PRDs whose snippets are
    # a record of what was written at the time, not live code — reformatting
    # them is churn every ruff bump would repeat. Ruff owns .py, not prose.
    "*.md",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports are the point of an __init__.py
"tests/**/*.py" = ["ARG001", "ARG002", "RUF012"]  # unused fixture args; ClassVar noise on test fixture classes

[tool.ruff.lint.isort]
known-first-party = ["src"]

# Minimal mypy config: tests import ``src.importers.X`` (via the project
# root being on ``sys.path``) so we anchor mypy at the repo root. Without
# ``explicit_package_bases`` mypy refuses to type-check ``src/`` and
# ``tests/`` in the same invocation — the pre-commit hook does that every
# time both buckets change in a single commit.
[tool.mypy]
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
exclude = "^(build|dist|htmlcov|\\.scannerwork)/"
