sonar.projectKey=adamkwhite_claude-memory-mcp
sonar.organization=adamkwhite
sonar.python.version=3.10
sonar.python.coverage.reportPaths=coverage.xml
sonar.sources=.
sonar.exclusions=**/*test*/**,**/__pycache__/**,htmlcov/**,archive/**,scripts/**,demo_validation.py,**/*benchmark*.py,**/*performance*.py

# Quality gate enforcement
sonar.qualitygate.wait=true

# Issue suppressions. Each entry states WHY, and is scoped as narrowly as the
# decision actually warrants -- a blanket rule-wide ignore is how a real bug
# stays invisible (see the S5852 note below).
#
# Removed: python:S5852 (ReDoS), previously ignored across **/*.py with the
# justification "personal project with trusted input sources". That premise was
# false: this project imports ChatGPT/Cursor/Claude conversation exports, and a
# genuine high-severity ReDoS shipped in _extract_topics (GitHub code-scanning
# alert #1, fixed in #152 -- 28 chars took 32s, and the trigger was ordinary
# pasted content like a hex digest or base64 blob, not an attack). SonarCloud
# was configured never to report that entire class of bug. CodeQL caught it
# instead. The rule is now active again.

# e1: python:S5145 in base_importer._parse_timestamp -- logs an untrusted
# timestamp string when every known format fails to parse. Mitigated: the value
# goes through lazy %r formatting, so control/newline chars are escaped rather
# than injected into the log. Kept deliberately: knowing WHICH timestamp failed
# is the whole diagnostic value, and the injection vector is closed. Resolved as
# Safe/WONTFIX in the SonarCloud UI, but encoded here too because a UI
# resolution does not survive a line shift -- reformatting the line creates a
# "new" issue and re-blocks the gate.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=pythonsecurity:S5145
sonar.issue.ignore.multicriteria.e1.resourceKey=**/importers/base_importer.py

# e2: python:S7503 x5 in conversation_memory.py -- get_search_stats,
# migrate_to_sqlite, search_by_tag, search_by_session_id and
# search_by_conversation_type are declared async without awaiting anything.
# They front a synchronous SearchDatabase, so the rule is technically right and
# substantively wrong: async here is the interface contract, not an oversight.
#
# These are the SQLite-only members of a uniformly async public interface whose
# siblings -- search_conversations, search_by_topic, add_conversation,
# update_conversation, get_conversation -- genuinely await aiofiles I/O.
# search_by_topic sits directly beside search_by_tag and IS async-with-await,
# for the one reason that matters here: it has a JSON fallback. The tag/session/
# type methods document that they do not, yet. Add one and await comes straight
# back -- as a breaking change to every caller, which is the outcome this entry
# exists to avoid.
#
# Cost of "fixing" it, counted rather than estimated: 4 live @mcp.tool()
# handlers in server_fastmcp.py and ~25 await sites across 6 test files, all of
# which raise TypeError the moment the coroutine becomes a dict.
#
# Scoped to the one file, per the S5852 lesson above -- a rule-wide ignore would
# also hide a genuinely stray async in code where no such contract applies.
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.e2.resourceKey=**/conversation_memory.py
